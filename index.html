<!DOCTYPE html>
<html>
<head>
    <title>Сюрприз для [линочки]</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1a0011, #4a0020);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        h1 {
            color: white;
            font-size: 48px;
            text-shadow: 0 0 30px rgba(255, 0, 100, 0.8);
            animation: glow 2s infinite alternate;
            z-index: 10;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px hotpink; }
            to { text-shadow: 0 0 60px red; }
        }
        .heart {
            font-size: 150px;
            color: #ff0040;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            text-shadow: 0 0 50px #ff0066;
            animation: beat 1s infinite;
            user-select: none;
        }
        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .heart:active {
            transform: scale(1.5);
        }
        #message {
            color: white;
            font-size: 28px;
            margin-top: 30px;
            opacity: 0;
            transition: 1s;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 20px 40px;
            border-radius: 50px;
            border: 2px solid pink;
        }
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: gold;
            border-radius: 50%;
            pointer-events: none;
            animation: fly 1.5s ease-out forwards;
        }
        @keyframes fly {
            0% { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }
    </style>
</head>
<body>

    <h1>❤️ [линаа] ❤️</h1>
    <div class="heart" id="heartButton">❤️</div>
    <div id="message">Ты — моё всё! С тобой я счастлив.</div>

    <script>
        document.getElementById('heartButton').onclick = function(e) {
            // Показываем сообщение
            document.getElementById('message').style.opacity = '1';
            
            // Делаем фейерверк искр
            for (let i = 0; i < 35; i++) {
                let spark = document.createElement('div');
                spark.classList.add('sparkle');
                let x = e.clientX || window.innerWidth/2;
                let y = e.clientY || window.innerHeight/2;
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';
                
                let angle = Math.random() * 360;
                let distance = Math.random() * 400 + 100;
                spark.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                spark.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                let colors = ['#ff0000', '#ff69b4', '#ffa500', '#ffff00', '#ff1493'];
                spark.style.background = colors[Math.floor(Math.random() * colors.length)];
                spark.style.width = Math.random() * 15 + 5 + 'px';
                spark.style.height = spark.style.width;
                
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 1500);
            }
        };
    </script>

</body>
</html>
