<!DOCTYPE html>
<html>
<head>
    <title>❤️ Сюрприз</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            background: #0d0015;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            font-family: 'Arial', sans-serif;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff3388;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0066;
            transition: all 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .dot.assembled {
            background: #ff0040;
            box-shadow: 0 0 12px #ff0066, 0 0 25px #ff0040;
            width: 9px;
            height: 9px;
        }

        #nameBlock {
            position: absolute;
            z-index: 100;
            pointer-events: none;
            text-align: center;
            width: 100%;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 1.5s ease;
            padding: 0 20px;
            box-sizing: border-box;
        }

        #nameBlock.show {
            opacity: 1;
        }

        #nameBlock .name {
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 30px #ff0066, 0 0 60px #ff0040, 0 0 100px #ff0066;
            display: block;
            margin-bottom: 8px;
        }

        #nameBlock .text {
            font-size: 16px;
            color: #ff99bb;
            text-shadow: 0 0 20px #ff0066;
            display: block;
            letter-spacing: 1px;
            padding: 0 10px;
        }

        #hint {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            z-index: 50;
            animation: blink 1.5s infinite;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        .burst-heart {
            position: fixed;
            font-size: 20px;
            pointer-events: none;
            z-index: 200;
            animation: burst 2s ease-out forwards;
        }

        @keyframes burst {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
        }

        .confetti {
            position: fixed;
            width: 6px;
            height: 6px;
            pointer-events: none;
            z-index: 150;
            animation: confettiFall 2.5s ease-in forwards;
        }

        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.3); }
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <div id="nameBlock">
        <span class="name">ЛИНОЧКА</span>
        <span class="text">Ты — мой мир! С тобой я счастлив ❤️</span>
    </div>

    <div id="hint">👆 Нажми в любом месте экрана</div>

    <script>
        const DOT_COUNT = 150;
        const container = document.getElementById('container');
        const nameBlock = document.getElementById('nameBlock');
        const hint = document.getElementById('hint');

        let dots = [];
        let isAssembled = false;

        function createDots() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const cx = w / 2;
            const cy = h / 2;
            // МАЛЕНЬКОЕ СЕРДЦЕ!
            const scale = Math.min(w, h) / 8;

            for (let i = 0; i < DOT_COUNT; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';

                const x = Math.random() * w;
                const y = Math.random() * h;
                dot.style.left = x + 'px';
                dot.style.top = y + 'px';
                const size = Math.random() * 5 + 4;
                dot.style.width = size + 'px';
                dot.style.height = size + 'px';

                const t = (i / DOT_COUNT) * Math.PI * 2;
                const heartX = 16 * Math.pow(Math.sin(t), 3);
                const heartY = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

                const targetX = cx + heartX * scale * 0.5;
                const targetY = cy - heartY * scale * 0.5 + 10;

                dot.dataset.targetX = targetX;
                dot.dataset.targetY = targetY;

                dot.addEventListener('click', assembleHearts);
                dot.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    assembleHearts();
                });

                container.appendChild(dot);
                dots.push(dot);
            }
        }

        let isAnimating = false;

        function assembleHearts() {
            if (isAnimating || isAssembled) return;
            isAnimating = true;

            hint.style.opacity = '0';
            hint.style.transition = '0.5s';

            dots.forEach((dot, index) => {
                setTimeout(() => {
                    const targetX = parseFloat(dot.dataset.targetX);
                    const targetY = parseFloat(dot.dataset.targetY);
                    dot.style.left = targetX + 'px';
                    dot.style.top = targetY + 'px';
                    dot.classList.add('assembled');
                }, index * 4);
            });

            setTimeout(() => {
                nameBlock.classList.add('show');
            }, DOT_COUNT * 4 + 400);

            setTimeout(() => {
                isAssembled = true;
                isAnimating = false;
                createExplosion();
                createConfetti();
            }, DOT_COUNT * 4 + 1000);
        }

        function createExplosion() {
            const emojis = ['❤️', '💖', '💗', '♥️', '💕', '💓', '💝'];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;

            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div');
                el.className = 'burst-heart';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = cx + 'px';
                el.style.top = cy + 'px';
                el.style.fontSize = (Math.random() * 20 + 12) + 'px';

                const angle = Math.random() * 360;
                const distance = Math.random() * 250 + 100;
                el.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                el.style.setProperty('--ty', Math.sin(angle) * distance - 150 + 'px');

                document.body.appendChild(el);
                setTimeout(() => el.remove(), 2000);
            }
        }

        function createConfetti() {
            const colors = ['#ff0066', '#ff3388', '#ff6699', '#ff99bb', '#ffccdd', '#ff0040'];

            for (let i = 0; i < 40; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * window.innerWidth + 'px';
                el.style.top = '-20px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.width = (Math.random() * 5 + 3) + 'px';
                el.style.height = (Math.random() * 5 + 3) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.animationDelay = (Math.random() * 1.5) + 's';

                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }
        }

        function playMusic() {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const notes = [523, 659, 784, 880, 988, 784, 880, 1047];

                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.value = 0.04;
                        osc.start();
                        setTimeout(() => osc.stop(), 200);
                    }, i * 200 + 500);
                });
            } catch (e) {}
        }

        createDots();

        setTimeout(() => {
            if (!isAssembled && !isAnimating) {
                assembleHearts();
            }
        }, 8000);

        document.addEventListener('click', function startMusic() {
            playMusic();
            document.removeEventListener('click', startMusic);
        }, { once: true });

        window.addEventListener('resize', () => {
            if (!isAssembled) {
                container.innerHTML = '';
                dots = [];
                createDots();
            }
        });
    </script>
</body>
</html>
